name: Rust beta

# Early warning for the next stable Rust release. tests/compile.rs matches
# rustc diagnostics, so a new compiler is the most likely cause of breakage.
# A red run is a signal to investigate, not a merge blocker: this workflow is
# not part of the required CI checks.
# Clippy is deliberately not run here: new beta lints report style, not
# compatibility, and denying warnings would turn them into failures.

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  # -- Beta toolchain canary (not a required check) ------------------
  beta:
    name: Beta toolchain
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'vhexl' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: beta
          targets: wasm32-unknown-unknown

      - name: Rust tests
        run: cargo test --locked --all-targets

      - name: Documentation examples
        run: cargo test --locked --doc

      - name: Documentation
        run: cargo doc --locked --no-deps

      - name: Node tests
        run: node --test tests/*.cjs

      - name: Wasm build
        run: cargo build --locked --release --target wasm32-unknown-unknown --example guest

      - name: Wasm verification
        run: node examples/verify-wasm.cjs target/wasm32-unknown-unknown/release/examples/guest.wasm
