name: Release-plz

# After merging to main, release-plz:
# 1. Opens/updates a Release PR with version bumps and changelog
# 2. On Release PR merge: publishes to crates.io and creates a GitHub release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Wait for the existing CI run; keep push for crates.io Trusted Publishing.
  # If CI fails and is later re-run successfully, re-run this workflow manually.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.repository_owner == 'vhexl' }}
    permissions:
      actions: read
      checks: read # needed by gh run watch
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Wait for successful push CI
        run: |
          run_id=
          # ci.yml/main are intentionally coupled to the CI workflow definition.
          # Treat transient gh/API errors like a missing run and retry.
          for attempt in {1..30}; do
            run_id=$(gh run list --repo "$GH_REPO" --workflow ci.yml --branch main --event push --commit "$RELEASE_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty') || run_id=
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::No push CI run found for main commit $RELEASE_SHA."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GH_REPO" --interval 10 --exit-status

  # -- Publish to crates.io + create GitHub release ------------------
  release-plz-release:
    name: Release-plz release
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'vhexl' }}
    permissions:
      contents: write # needed to create git tags
      id-token: write # needed for crates.io Trusted Publishing (OIDC)
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the CI-validated revision even if main has advanced.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          # No CARGO_REGISTRY_TOKEN: with id-token: write, release-plz exchanges
          # the job's OIDC token for a short-lived crates.io token. This needs a
          # Trusted Publisher on crates.io (owner vhexl, repository abi-adapter,
          # workflow release-plz.yml, no environment).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -- Create / update Release PR ------------------------------------
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.repository_owner == 'vhexl' }}
    permissions:
      contents: write # needed to push version bump branches
      pull-requests: write # needed to create/update the Release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          # GITHUB_TOKEN-created/updated PRs need a maintainer to approve CI.
          # Set RELEASE_PLZ_TOKEN (a PAT or GitHub App token) for automatic CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
